name: Rotate Profile Slideshow

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-slideshow
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Rotate image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_DIR="assets/slideshow"
          INDEX_FILE="$IMAGE_DIR/index.txt"
          CURRENT_IMAGE="$IMAGE_DIR/current.jpg"

          mapfile -t IMAGES < <(
            find "$IMAGE_DIR" \
              -maxdepth 1 \
              -type f \
              -name "image-*.jpg" \
              | sort -V
          )

          TOTAL_IMAGES=${#IMAGES[@]}

          if [ "$TOTAL_IMAGES" -eq 0 ]; then
            echo "ERROR: No slideshow images found."
            exit 1
          fi

          if [ ! -f "$INDEX_FILE" ]; then
            echo "0" > "$INDEX_FILE"
          fi

          CURRENT_INDEX=$(tr -d '[:space:]' < "$INDEX_FILE")

          if ! [[ "$CURRENT_INDEX" =~ ^[0-9]+$ ]]; then
            CURRENT_INDEX=0
          fi

          NEXT_INDEX=$((CURRENT_INDEX + 1))

          if [ "$NEXT_INDEX" -gt "$TOTAL_IMAGES" ]; then
            NEXT_INDEX=1
          fi

          NEXT_IMAGE="$IMAGE_DIR/image-$NEXT_INDEX.jpg"

          if [ ! -f "$NEXT_IMAGE" ]; then
            echo "ERROR: $NEXT_IMAGE does not exist."
            exit 1
          fi

          echo "Current index: $CURRENT_INDEX"
          echo "Next index: $NEXT_INDEX"
          echo "Total images: $TOTAL_IMAGES"

          cp "$NEXT_IMAGE" "$CURRENT_IMAGE"
          echo "$NEXT_INDEX" > "$INDEX_FILE"

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/slideshow/current.jpg
          git add assets/slideshow/index.txt

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: rotate profile slideshow"

      - name: Sync with main
        run: |
          git pull --rebase origin main

      - name: Push changes
        run: |
          git push origin main
